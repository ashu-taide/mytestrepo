version: 1.0.0
events:
  build:
    steps:
      - version_check:
          script:
            - 'rm -f /tmp/version_check_failure'
            - 'chmod 555 $SOURCE_DIR/check-versions.sh $SOURCE_DIR/check-container-versions.sh'
            - '$SOURCE_DIR/check-container-versions.sh'
            - 'echo "Checking php extension versions..."'
            - 'php $SOURCE_DIR/check-php-extensions-versions.php'
            - 'php7.4 $SOURCE_DIR/check-php-extensions-versions.php'
            - 'php8.2 $SOURCE_DIR/check-php-extensions-versions.php'
            # Fail this test if there were any failures.
            - 'if [ -f /tmp/version_check_failure ]; then'
            -   'echo "Failures in the version check:"'
            -   'cat /tmp/version_check_failure'
            -   'exit 1'
            - 'fi'
