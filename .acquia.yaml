build-steps:
  - post-build:
      type: script
      script:
        - set -e
        - chmod 555 %SOURCE_DIR%/check-versions.sh
        - echo -e "Checking ruby version..."
        - %SOURCE_DIR%/check-versions.sh "ruby" "`ruby --version`" "2.1.5"
        - echo -e "Checking vim version..."
        - %SOURCE_DIR%/check-versions.sh "vim" "`vim --version`" "7.4"
        - echo -e "Checking ssh version..."
        - %SOURCE_DIR%/check-versions.sh "ssh" "`ssh -V 2>&1`" "OpenSSH_6.7p1"
        - echo -e "Checking rsync version..."
        - %SOURCE_DIR%/check-versions.sh "rsync" "`rsync --version`" "3.1.1"
        - echo -e "Checking nodejs version..."
        - %SOURCE_DIR%/check-versions.sh "nodejs" "`nodejs --version`" "v0.12.7"
        - echo -e "Checking git version..."
        - %SOURCE_DIR%/check-versions.sh "git" "`git --version`" "2.1.4"
        - echo -e "Checking unzip version..."
        - %SOURCE_DIR%/check-versions.sh "unzip" "`unzip -v`" "6.00"
        - echo -e "Checking gem version..."
        - %SOURCE_DIR%/check-versions.sh "gem" "`gem --version`" "2.4.8"
        - echo -e "Checking compass version..."
        - %SOURCE_DIR%/check-versions.sh "compass" "`compass --version`" "1.0.3"
        - echo -e "Checking npm version..."
        - %SOURCE_DIR%/check-versions.sh "npm" "`npm --version`" "2.11.3"
        - echo -e "Checking grunt version..."
        - %SOURCE_DIR%/check-versions.sh "grunt" "`grunt --version`" "v0.1.13"
        - echo -e "Checking bower version..."
        - %SOURCE_DIR%/check-versions.sh "bower" "`bower --version`" "1.5.3"
        - echo -e "Checking drush version..."
        - %SOURCE_DIR%/check-versions.sh "drush" "`drush --version`" "6.6.0"
        - echo -e "Checking php extension versions..."
        - php %SOURCE_DIR%/check-php-extensions-versions.php 
