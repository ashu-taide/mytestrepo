build-steps:
  - post-build:
      type: script
      script:
        - rm -f /tmp/version_check_failure
        - chmod 555 $SOURCE_DIR/check-versions.sh
        - $SOURCE_DIR/check-versions.sh "php" "$(php --version)" "5.6.24"
        - $SOURCE_DIR/check-versions.sh "acquia-yaml" "$(gem list acquia-yaml)" "1.0.4"
        - $SOURCE_DIR/check-versions.sh "composer" "$(composer --no-ansi --version)" "1.2.0"
        - $SOURCE_DIR/check-versions.sh "ruby" "$(ruby --version)" "2.1.5"
        - $SOURCE_DIR/check-versions.sh "ssh" "$(ssh -V 2>&1)" "OpenSSH_6.7p1"
        - $SOURCE_DIR/check-versions.sh "rsync" "$(rsync --version)" "3.1.1"
        - $SOURCE_DIR/check-versions.sh "nodejs" "$(nodejs --version)" "v4.4.7"
        - $SOURCE_DIR/check-versions.sh "git" "$(git --version)" "2.1.4"
        - $SOURCE_DIR/check-versions.sh "unzip" "$(unzip -v)" "6.00"
        - $SOURCE_DIR/check-versions.sh "bzip2" "$(bzip2 --version 2>&1 | head -n1)" "1.0.6"
        - $SOURCE_DIR/check-versions.sh "gem" "$(gem --version)" "2.6.6"
        - $SOURCE_DIR/check-versions.sh "compass" "$(compass --version)" "1.0.3"
        - $SOURCE_DIR/check-versions.sh "npm" "$(npm --version)" "2.15.8"
        - $SOURCE_DIR/check-versions.sh "grunt" "$(grunt --version)" "v1.2.0"
        - $SOURCE_DIR/check-versions.sh "bower" "$(bower --version)" "1.7.9"
        - $SOURCE_DIR/check-versions.sh "drush default" "$(drush --version)" "7.3.0"
        - $SOURCE_DIR/check-versions.sh "drush6" "$(drush6 --version)" "6.7.0"
        - $SOURCE_DIR/check-versions.sh "drush7" "$(drush7 --version)" "7.3.0"
        - $SOURCE_DIR/check-versions.sh "drush8" "$(drush8 --version)" "8.0.3"
        - $SOURCE_DIR/check-versions.sh "wget" "$(wget --version)" "1.16"
        - $SOURCE_DIR/check-versions.sh "mysql" "$(mysql --version)" "5.5.50"
        - $SOURCE_DIR/check-versions.sh "patch" "$(patch --version)" "2.7.5"
        -
        - echo "Checking php extension versions..."
        - php $SOURCE_DIR/check-php-extensions-versions.php
        - # The PHP pcntl extension does not have a version string.
        - $SOURCE_DIR/check-versions.sh "php pcntl extension" "$(php -m)" "pcntl"
        - $SOURCE_DIR/check-versions.sh "php bcmath extension" "$(php -m)" "bcmath"
        -
        - # Fail this test if there were any failures.
        - if [ -f /tmp/version_check_failure ]; then
        -   echo "Failures in the version check:"
        -   cat /tmp/version_check_failure
        -   exit 1
        - fi
